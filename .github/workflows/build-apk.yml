name: Build test app

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: vre-bench-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK next to the web page
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk docs/vre-bench.apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/vre-bench.apk
          git diff --cached --quiet || (git commit -m "Update test app APK [skip ci]" && git push)
