<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VR Expert Diagnostics</title>
<meta name="theme-color" content="#ff6a00">
<script>try{var t=localStorage.getItem("vre-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===== VR Expert brand tokens: orange + white (light) / orange + black (dark) ===== */
:root{
  --brand:#ff6a00;        /* orange: buttons, active tab, selection */
  --brand-ink:#111111;    /* text on orange */
  --brand-text:#c24a00;   /* orange used as text on white (readable) */
  --brand-soft:#fff0e4;   /* tinted selection background */
  --ink:#111111;
  --bg:#f7f7f7;
  --surface:#ffffff;
  --sunken:#f0f0f0;
  --muted:#5c5c5c;
  --line:#e2e2e2;
}
/* ===== status colours (semantic, independent of the brand) ===== */
:root{
  --ok:#157a3e;   --ok-bg:#e0f4e8;
  --warn:#9a5b00; --warn-bg:#fdf0d2;
  --bad:#b3261e;  --bad-bg:#fde4e1;
  --na:#7b8294;   --na-bg:#eceef4;
  --mark:#ffe58a;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"Cascadia Code",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --brand:#ff7a1a; --brand-ink:#111111; --brand-text:#ff8a3d; --brand-soft:#3a210f;
  --ink:#f5f5f5; --bg:#0a0a0a; --surface:#141414; --sunken:#1d1d1d; --muted:#a3a3a3; --line:#2a2a2a;
  --ok:#5fd68c; --ok-bg:#12301f; --warn:#f2b551; --warn-bg:#35280d; --bad:#ff8a7e; --bad-bg:#3b1815; --na:#8b93a7; --na-bg:#232836; --mark:#6b5a12;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#ff7a1a; --brand-ink:#111111; --brand-text:#ff8a3d; --brand-soft:#3a210f;
  --ink:#f5f5f5; --bg:#0a0a0a; --surface:#141414; --sunken:#1d1d1d; --muted:#a3a3a3; --line:#2a2a2a;
  --ok:#5fd68c; --ok-bg:#12301f; --warn:#f2b551; --warn-bg:#35280d; --bad:#ff8a7e; --bad-bg:#3b1815; --na:#8b93a7; --na-bg:#232836; --mark:#6b5a12;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3,p{margin:0}
.mono{font-family:var(--mono)}

header{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;letter-spacing:-.01em}
.brand span{font-weight:500;color:var(--muted);margin-left:6px}
.who{margin-left:auto;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.who b{color:var(--ink);font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:6px;font-weight:600}
.btn:hover:not(:disabled){border-color:var(--brand)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.icon{padding:7px 9px;display:grid;place-items:center}
.btn.icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.link{background:none;border:0;padding:0;color:var(--brand-text);font-weight:600;text-decoration:underline;text-underline-offset:2px}

#progress{height:2px;background:transparent}
#progress.busy{background:linear-gradient(90deg,var(--brand) 40%,transparent 40%) 0 0/200% 100%;animation:slide 1.1s linear infinite}
@keyframes slide{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){#progress.busy{animation:none;background:var(--brand)}}
#notice{padding:8px 20px;background:var(--bad-bg);color:var(--bad);border-bottom:1px solid var(--line)}

nav{display:flex;gap:4px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--line)}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:11px 12px;color:var(--muted);font-weight:600}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
main{flex:1;min-height:0;display:flex}
.view{display:none;flex:1;min-width:0;min-height:0}
.view.active{display:flex}
.page{flex:1;overflow:auto;padding:24px 20px 40px}
.wrap{max-width:1080px;margin:0 auto}

/* ---- overview ---- */
.verdict{display:flex;align-items:center;gap:18px;padding:20px 22px;border-radius:12px;background:var(--surface);border:1px solid var(--line);flex-wrap:wrap}
.verdict .mark{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:26px;font-weight:700;flex:none}
.verdict[data-state="ok"] .mark{background:var(--ok-bg);color:var(--ok)}
.verdict[data-state="warn"] .mark{background:var(--warn-bg);color:var(--warn)}
.verdict[data-state="fail"] .mark{background:var(--bad-bg);color:var(--bad)}
.verdict h1{font-size:26px;letter-spacing:-.02em;line-height:1.15}
.verdict[data-state="ok"] h1{color:var(--ok)}
.verdict[data-state="warn"] h1{color:var(--warn)}
.verdict[data-state="fail"] h1{color:var(--bad)}
.verdict p{color:var(--muted);margin-top:2px}
.verdict .btn{margin-left:auto}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;margin-top:26px;align-items:start}
.cols h2{font-size:15px;margin:0 0 10px}
.cols section+section{margin-top:26px}
.check{display:grid;grid-template-columns:22px 1fr auto;gap:2px 12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:baseline}
.check:first-of-type{border-top:1px solid var(--line)}
.check .g{font-weight:700;text-align:center}
.check[data-s="ok"] .g{color:var(--ok)} .check[data-s="warn"] .g{color:var(--warn)} .check[data-s="fail"] .g{color:var(--bad)} .check[data-s="na"] .g{color:var(--na)}
.check .n{font-weight:600}
.check .d{grid-column:2;color:var(--muted);font-size:13px}
.check .val{font:500 13px var(--mono);text-align:right;white-space:nowrap}
.check.compact{padding:8px 0}
.check.compact .d{display:none}
.check.compact .n{font-weight:500}
dl.kv{margin:0;display:grid;grid-template-columns:auto 1fr;gap:7px 14px}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;text-align:right;word-break:break-word}
.bench{display:flex;gap:18px 28px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:18px;padding:16px 20px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.bench h2{font-size:15px;margin-bottom:4px}
.bench p{color:var(--muted);max-width:62ch;font-size:13px}
.bench-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bench select{background:var(--sunken);border:1px solid transparent;border-radius:6px;color:var(--ink);padding:7px 10px;font:inherit}
.bench-status{color:var(--muted);font-size:13px}
.scope{margin-top:26px;color:var(--muted);font-size:13px;max-width:70ch}
.empty{margin:12vh auto 0;max-width:420px;text-align:center}
.empty h1{font-size:22px;letter-spacing:-.01em;margin-bottom:8px}
.empty p{color:var(--muted);margin-bottom:16px}

/* ---- properties ---- */
.side{width:210px;flex:none;border-right:1px solid var(--line);background:var(--surface);overflow:auto;padding:10px 8px}
.cat{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:6px 10px;color:var(--muted)}
.cat:hover{background:var(--sunken)}
.cat[aria-pressed="true"]{background:var(--brand-soft);color:var(--ink);font-weight:600}
.cat i{font-style:normal;font-size:12px;opacity:.7}
.list{flex:1;min-width:0;display:flex;flex-direction:column}
.tools{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.tools input{flex:1;min-width:200px;background:var(--sunken);border:1px solid transparent;border-radius:6px;color:var(--ink);padding:8px 12px;font:13px var(--mono)}
.tools input:focus{border-color:var(--brand);outline:0}
.seg{display:flex;gap:2px}
.seg button{background:none;border:0;border-radius:6px;padding:6px 10px;color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--brand-soft);color:var(--ink)}
.rows{flex:1;overflow:auto}
.row{display:grid;grid-template-columns:minmax(220px,42%) 1fr;gap:16px;padding:7px 16px;border-bottom:1px solid var(--line);cursor:pointer;align-items:baseline}
.row:hover{background:var(--sunken)}
.row[aria-selected="true"]{background:var(--brand-soft)}
.k,.v{font:13px var(--mono);word-break:break-all}
.k .dim{color:var(--muted)} .k .last{font-weight:500}
.v{color:var(--muted);display:flex;gap:8px;align-items:baseline;min-width:0}
.v .txt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{flex:none;font:500 11px var(--sans);padding:0 7px;border-radius:4px;background:var(--na-bg);color:var(--na)}
.tag.true,.tag.running{background:var(--ok-bg);color:var(--ok)}
.tag.false,.tag.stopped{background:var(--bad-bg);color:var(--bad)}
.tag.restarting{background:var(--warn-bg);color:var(--warn)}
mark{background:var(--mark);color:inherit;border-radius:2px}
.msg{padding:48px 24px;text-align:center;color:var(--muted)}

.drawer{width:400px;flex:none;border-left:1px solid var(--line);background:var(--surface);overflow:auto;padding:18px;display:none}
.drawer.open{display:block}
.drawer .top{display:flex;justify-content:space-between;align-items:start;gap:10px}
.drawer .x{background:none;border:0;font-size:22px;line-height:1;color:var(--muted);padding:0 4px}
.crumbs{font:500 15px var(--mono);word-break:break-all}
.crumbs .c{color:var(--muted)}
.drawer h3{font-size:12px;color:var(--muted);font-weight:600;margin:16px 0 6px}
.valbox{font:13px/1.5 var(--mono);background:var(--sunken);border-radius:8px;padding:10px 12px;word-break:break-all;white-space:pre-wrap;max-height:220px;overflow:auto}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.actions .btn{padding:5px 10px;font-size:12px}
.drawer dl{display:grid;grid-template-columns:84px 1fr;gap:8px 12px;margin:6px 0 0}
.drawer dt{color:var(--muted)} .drawer dd{margin:0;min-width:0;word-break:break-word}
.related button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:5px 0;font:12px var(--mono);color:var(--muted);word-break:break-all}
.related button:hover{color:var(--brand-text)}

/* ---- raw ---- */
details{border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-bottom:8px}
details summary{padding:10px 14px;cursor:pointer;font-weight:600}
details pre{margin:0;padding:12px 14px;border-top:1px solid var(--line);font:12px/1.5 var(--mono);overflow:auto;max-height:360px;color:var(--muted)}

@media (max-width:900px){
  .side{display:none}
  .cols{grid-template-columns:1fr}
  .drawer{position:fixed;inset:0 0 0 auto;width:min(420px,100%);z-index:5;box-shadow:-10px 0 30px #0005}
  .row{grid-template-columns:1fr;gap:2px}
  .verdict .btn{margin-left:0}
}
</style>
</head>
<body>
<header>
  <div class="brand">VR Expert<span>Diagnostics</span></div>
  <div class="who" id="who"></div>
  <button class="btn" id="refresh" disabled>Re-read</button>
  <button class="btn primary" id="connect">Connect headset</button>
  <button class="btn icon" id="theme" type="button"></button>
</header>
<div id="progress"></div>
<div id="notice" hidden role="alert"></div>
<nav role="tablist">
  <button role="tab" aria-selected="true" data-tab="overview">Overview</button>
  <button role="tab" aria-selected="false" data-tab="props">Properties</button>
  <button role="tab" aria-selected="false" data-tab="raw">Raw output</button>
</nav>
<main>
  <section class="view active" id="v-overview"><div class="page"><div class="wrap" id="overview"></div></div></section>
  <section class="view" id="v-props">
    <aside class="side" id="cats"></aside>
    <div class="list">
      <div class="tools">
        <input id="q" type="search" placeholder="Search keys and values" autocomplete="off" spellcheck="false" aria-label="Search properties">
        <div class="seg" id="kinds" role="group" aria-label="Filter by type">
          <button data-kind="all" aria-pressed="true">All</button>
          <button data-kind="ro" aria-pressed="false">ro.*</button>
          <button data-kind="persist" aria-pressed="false">persist.*</button>
          <button data-kind="runtime" aria-pressed="false">Runtime</button>
        </div>
        <button class="btn" id="exp-json" disabled>JSON</button>
        <button class="btn" id="exp-csv" disabled>CSV</button>
      </div>
      <div class="rows" id="rows"></div>
    </div>
    <aside class="drawer" id="drawer" aria-live="polite"></aside>
  </section>
  <section class="view" id="v-raw"><div class="page"><div class="wrap" id="raw"></div></div></section>
</main>
<input type="file" id="apk" accept=".apk" hidden>
<script src="main.js?v=7"></script>
</body>
</html>
