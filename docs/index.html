<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pico Bench · Headset Diagnostics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f7; --panel:#ffffff; --panel2:#eceff3; --line:#d9dee5; --fg:#161b22; --dim:#5b6675; --faint:#8a94a3;
  --accent:#00857a; --accent-bg:#d8f3ef; --warn:#a86400; --warn-bg:#fdecc8; --bad:#c0372b; --good:#1d8a46; --mark:#ffe58a;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"Cascadia Code",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0f14; --panel:#121820; --panel2:#18202a; --line:#242e3a; --fg:#e6ebf1; --dim:#93a0b0; --faint:#66727f;
  --accent:#35e0cc; --accent-bg:#0f3a3a; --warn:#f0b24a; --warn-bg:#3a2b0e; --bad:#ff6b5b; --good:#4ad27c; --mark:#6b5a12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0f14; --panel:#121820; --panel2:#18202a; --line:#242e3a; --fg:#e6ebf1; --dim:#93a0b0; --faint:#66727f;
  --accent:#35e0cc; --accent-bg:#0f3a3a; --warn:#f0b24a; --warn-bg:#3a2b0e; --bad:#ff6b5b; --good:#4ad27c; --mark:#6b5a12; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--sans);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,.row:focus-visible,.cat:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mono{font-family:var(--mono)}

/* top bar */
header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:6px}
.brand b{font-size:16px;letter-spacing:.02em}
.brand span{color:var(--faint);font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase}
.btn{border:1px solid var(--line);background:var(--panel2);padding:7px 13px;border-radius:6px;font-weight:600}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#04201d}
.btn.ghost{background:transparent}
.device{display:flex;gap:10px;align-items:center;margin-left:auto;flex-wrap:wrap}
.chip{font:500 12px var(--mono);padding:4px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--dim)}
.chip b{color:var(--fg);font-weight:500}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--faint);margin-right:6px}
.dot.on{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
#status{padding:6px 16px;font:12px var(--mono);color:var(--dim);border-bottom:1px solid var(--line);background:var(--panel2);min-height:30px}
#status.err{color:var(--bad)} #status.ok{color:var(--good)}
.banner{background:var(--warn-bg);color:var(--warn);padding:6px 16px;font:600 12px var(--mono);letter-spacing:.04em;border-bottom:1px solid var(--line)}

/* tabs */
nav{display:flex;gap:2px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line)}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;color:var(--dim);font-weight:600}
nav button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
nav .count{font:500 11px var(--mono);color:var(--faint);margin-left:6px}
main{flex:1;min-height:0;display:flex}
.view{display:none;flex:1;min-width:0;min-height:0}
.view.active{display:flex}

/* property explorer */
.side{width:230px;flex:none;border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:10px 8px}
.side h4{margin:8px 8px 6px;font:600 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.cat{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:6px 8px;color:var(--dim)}
.cat:hover{background:var(--panel2)}
.cat[aria-pressed="true"]{background:var(--accent-bg);color:var(--fg)}
.cat i{font:500 11px var(--mono);font-style:normal;color:var(--faint)}
.list{flex:1;min-width:0;display:flex;flex-direction:column}
.tools{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:0 10px}
.search input{flex:1;background:none;border:0;color:var(--fg);padding:9px 0;font:14px var(--mono);outline:0}
.search:focus-within{border-color:var(--accent)}
.search kbd{font:500 11px var(--mono);color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--panel);border:0;padding:7px 11px;color:var(--dim);font-weight:600;font-size:13px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-bg);color:var(--fg)}
.meta{padding:6px 14px;color:var(--faint);font:12px var(--mono);border-bottom:1px solid var(--line)}
.rows{flex:1;overflow:auto}
.row{display:grid;grid-template-columns:minmax(220px,42%) 1fr;gap:16px;padding:7px 14px;border-bottom:1px solid var(--line);cursor:pointer;align-items:baseline}
.row:hover{background:var(--panel2)}
.row[aria-selected="true"]{background:var(--accent-bg)}
.k{font:13px var(--mono);word-break:break-all}
.k .seg-dim{color:var(--faint)}
.k .seg-last{color:var(--fg);font-weight:500}
.v{font:13px var(--mono);color:var(--dim);word-break:break-all;display:flex;gap:8px;align-items:baseline;min-width:0}
.v span.txt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{flex:none;font:600 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);color:var(--faint)}
.tag.true,.tag.running{color:var(--good)} .tag.false,.tag.stopped{color:var(--bad)}
mark{background:var(--mark);color:inherit;border-radius:2px}
.empty{padding:60px 24px;text-align:center;color:var(--dim)}
.empty h2{margin:0 0 6px;color:var(--fg);font-size:18px}
.empty .btn{margin:6px 4px 0}

/* drawer */
.drawer{width:400px;flex:none;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:16px;display:none}
.drawer.open{display:block}
.drawer h3{margin:0 0 4px;font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.crumbs{font:500 15px var(--mono);word-break:break-all;margin:0 0 14px}
.crumbs .c-dim{color:var(--faint)}
.valbox{font:13px/1.5 var(--mono);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;word-break:break-all;white-space:pre-wrap;max-height:220px;overflow:auto}
dl{display:grid;grid-template-columns:100px 1fr;gap:8px 12px;margin:14px 0}
dt{color:var(--faint);font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding-top:2px}
dd{margin:0;min-width:0;word-break:break-word}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.actions .btn{padding:5px 10px;font-size:12px}
.related button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:5px 0;font:12px var(--mono);color:var(--dim);word-break:break-all}
.related button:hover{color:var(--accent)}

/* overview & raw */
.page{flex:1;overflow:auto;padding:18px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.card h3{margin:0 0 10px;font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
.kv dt{padding:0}.kv dd{font:13px var(--mono);text-align:right}
.big{font:700 34px var(--mono);letter-spacing:-.02em}
.big small{font-size:14px;color:var(--faint);margin-left:4px}
.bar{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden;margin:8px 0 12px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.low i{background:var(--bad)} .bar.mid i{background:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.stat b{display:block;font:700 22px var(--mono)} .stat span{color:var(--faint);font:11px var(--mono);text-transform:uppercase;letter-spacing:.08em}
details{border:1px solid var(--line);border-radius:8px;background:var(--panel);margin-bottom:8px}
details summary{padding:9px 12px;cursor:pointer;font:500 13px var(--mono)}
details pre{margin:0;padding:12px;border-top:1px solid var(--line);font:12px/1.5 var(--mono);overflow:auto;max-height:340px;color:var(--dim)}

@media (max-width:900px){
  .side{display:none}
  .drawer{position:fixed;inset:0 0 0 auto;width:min(420px,100%);z-index:5;box-shadow:-10px 0 30px #0006}
  .row{grid-template-columns:1fr;gap:2px}
}
@media (prefers-reduced-motion:no-preference){.row,.btn,.cat{transition:background .12s,border-color .12s}}
</style>
</head>
<body>
<header>
  <div class="brand"><b>Pico Bench</b><span>Headset diagnostics</span></div>
  <button class="btn primary" id="connect">Connect headset</button>
  <button class="btn" id="refresh" disabled>Re-read</button>
  <button class="btn ghost" id="sample">Load sample data</button>
  <div class="device" id="device"></div>
</header>
<div id="status">Waiting for a headset. Enable USB debugging, plug it in over USB and press “Connect headset”.</div>
<div id="banner" class="banner" hidden>SAMPLE DATA · not read from a real headset</div>
<nav role="tablist">
  <button role="tab" aria-selected="true" data-tab="props">Properties<span class="count" id="c-props"></span></button>
  <button role="tab" aria-selected="false" data-tab="overview">Overview</button>
  <button role="tab" aria-selected="false" data-tab="raw">Raw output<span class="count" id="c-raw"></span></button>
</nav>
<main>
  <section class="view active" id="v-props">
    <aside class="side" id="cats"></aside>
    <div class="list">
      <div class="tools">
        <label class="search"><span class="mono" style="color:var(--faint)">⌕</span><input id="q" type="search" placeholder="Search keys and values…" autocomplete="off" spellcheck="false"><kbd>/</kbd></label>
        <div class="seg" id="kinds" role="group" aria-label="Filter by type">
          <button data-kind="all" aria-pressed="true">All</button>
          <button data-kind="ro" aria-pressed="false">ro.*</button>
          <button data-kind="persist" aria-pressed="false">persist.*</button>
          <button data-kind="runtime" aria-pressed="false">Runtime</button>
        </div>
        <button class="btn" id="exp-json" disabled>JSON</button>
        <button class="btn" id="exp-csv" disabled>CSV</button>
      </div>
      <div class="meta" id="meta"></div>
      <div class="rows" id="rows"></div>
    </div>
    <aside class="drawer" id="drawer" aria-live="polite"></aside>
  </section>
  <section class="view" id="v-overview"><div class="page" id="overview"></div></section>
  <section class="view" id="v-raw"><div class="page" id="raw"></div></section>
</main>
<script src="main.js"></script>
</body>
</html>
